name: erp_mobile
description: "Enterprise ERP Mobile — clean architecture, offline-first, multi-module."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management ────────────────────────────────────────────
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7

  # ── Dependency injection ────────────────────────────────────────
  get_it: ^8.0.3
  injectable: ^2.5.0

  # ── Navigation ──────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Networking ──────────────────────────────────────────────────
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  pretty_dio_logger: ^1.4.0
  web_socket_channel: ^3.0.1

  # ── Local persistence ───────────────────────────────────────────
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # ── Secure storage / auth ───────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  oauth2: ^2.0.3
  local_auth: ^2.3.0
  jwt_decoder: ^2.0.1

  # ── Models / serialization ──────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dartz: ^0.10.1

  # ── UI / charts / scanning ──────────────────────────────────────
  fl_chart: ^0.69.2
  mobile_scanner: ^6.0.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0

  # ── Utilities ───────────────────────────────────────────────────
  logger: ^2.5.0
  intl: ^0.20.2
  collection: ^1.18.0
  crypto: ^3.0.3
  meta: ^1.16.0
  rxdart: ^0.28.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Lints ───────────────────────────────────────────────────────
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0

  # ── Codegen ─────────────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  drift_dev: ^2.21.0

  # ── Testing ─────────────────────────────────────────────────────
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  test: ^1.25.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
