org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental compilation breaks when plugin sources live on a
# different drive (C:\…\Pub\Cache) than the build dir (D:\…\build) — it
# throws "this and base files have different roots" closing its caches.
# Disabling incremental forces full compiles (slightly slower, but
# reliable on this cross-drive Windows setup).
kotlin.incremental=false
