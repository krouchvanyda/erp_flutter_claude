# One APK per flavor (dev · uat · prod), after analyze + test pass.
#
#   push to feature/chat-notifications ─► test ─► apk (dev) ─► erp-dev-1.0.0-42.apk
#   Run workflow (button), ticks ☑ dev ☑ uat ☑ prod ─► one APK per tick
#   Actions tab → "Flavor APKs" → Run workflow → tick ☑ dev ☑ uat ☐ prod.
#
# Download: the run page → "Artifacts" (kept 30 days).

name: Flavor APKs

on:
  push:
    branches: ["feature/chat-notifications"] # a push builds dev only
  workflow_dispatch: # the "Run workflow" button: tick the APKs you want
    inputs:
      dev:
        description: dev APK
        type: boolean
        default: true
      uat:
        description: uat APK
        type: boolean
        default: false
      prod:
        description: prod APK (needs the signing secrets)
        type: boolean
        default: false

jobs:
  # Turns the ticks into a list for the matrix: ["dev","uat"].
  pick:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.list.outputs.flavors }}
    steps:
      - id: list
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          DEV: ${{ inputs.dev }}
          UAT: ${{ inputs.uat }}
          PROD: ${{ inputs.prod }}
        run: |
          if [ "$MANUAL" != "true" ]; then
            list='["dev"]'                     # a push → dev only
          else
            items=()
            [ "$DEV" = "true" ] && items+=('"dev"')
            [ "$UAT" = "true" ] && items+=('"uat"')
            [ "$PROD" = "true" ] && items+=('"prod"')
            list="[$(IFS=,; echo "${items[*]}")]"
          fi
          echo "APKs to build: $list"
          echo "flavors=$list" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Flutter + pub get (shared: .github/actions/setup-flutter).
      # This branch needs Flutter 3.44+ (pubspec.lock: Dart >=3.12):
      # the same version as our Mac → same analyze / test results.
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: 3.47.5
      - run: flutter analyze
      - run: flutter test

  apk:
    needs: [pick, test] # no APK if a test is red
    if: needs.pick.outputs.flavors != '[]' # nothing ticked → nothing to build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # prod without its key fails ALONE; dev + uat still build
      matrix:
        flavor: ${{ fromJSON(needs.pick.outputs.flavors) }} # e.g. ["dev","uat"]
    steps:
      - uses: actions/checkout@v4

      # A NEW machine → Java + Flutter + pub get again
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: 3.47.5
          java: "true" # build.gradle.kts: JavaVersion.VERSION_17

      # prod is signed with the UPLOAD key (Play Store). build.gradle.kts stops
      # a prod release without android/key.properties, so we write it here
      # from GitHub Secrets. The key never goes into git.
      - name: Prod signing key (from GitHub Secrets)
        if: matrix.flavor == 'prod'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::prod needs the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF

      - name: Read the version
        id: version
        run: |
          name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # versionCode = the run number → every APK installs over the last one
      - name: Build ${{ matrix.flavor }} APK
        run: >
          flutter build apk --release
          --flavor ${{ matrix.flavor }}
          -t lib/main_${{ matrix.flavor }}.dart
          --build-number=${{ github.run_number }}

      - name: Rename the APK
        run: >
          mv build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          "erp-${{ matrix.flavor }}-${{ steps.version.outputs.name }}-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: erp-${{ matrix.flavor }}-apk
          path: erp-${{ matrix.flavor }}-*.apk
          retention-days: 30
