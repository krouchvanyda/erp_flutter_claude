# CI: on every push / PR to master or develop → Flutter → analyze → test.
# CD: a push to master that passed → release APK on GitHub Releases.
# A red ❌ here means: don't merge.

name: Flutter CI

on:
  push:
    branches: ["master", "develop"] # every push to these branches
  pull_request:
    branches: ["master", "develop"] # every PR INTO these branches

jobs:
  build:
    runs-on: ubuntu-latest # Linux = the cheapest runner; enough for analyze + test

    steps:
      - uses: actions/checkout@v4

      # The runner has no Flutter. setup-dart gives ONLY Dart, so `flutter`
      # was "command not found". This action installs the Flutter SDK
      # (Dart comes inside it).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # master was made with Flutter 3.35 (pubspec.lock: flutter >=3.35.6,
          # Dart ^3.9.2). A newer Flutter can't resolve its packages
          # (freezed 2.x needs an old analyzer). 3.35.x = the newest 3.35 patch.
          flutter-version: 3.35.x
          cache: true # keep the SDK between runs → faster

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # CD: tests passed on a PUSH to master → build the APK → GitHub Release.
  # (develop and PRs stop after the tests.)
  release-apk:
    needs: build # only if analyze + test above are green
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the tag + the Release

    steps:
      - uses: actions/checkout@v4

      # The Android build (Gradle) needs Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # versionName from pubspec (1.0.0), versionCode = the run number, so
      # every build can be installed over the last one.
      - name: Read the version
        id: version
        run: |
          name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Release signs with the DEBUG key for now (android/app/build.gradle.kts):
      # fine for testers, NOT for the Play Store.
      - name: Build the release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename the APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "erp-${{ steps.version.outputs.name }}-${{ github.run_number }}.apk"

      # Downloadable from the run page (kept 90 days by default).
      - uses: actions/upload-artifact@v4
        with:
          name: erp-apk
          path: erp-*.apk

      # A Release page with the APK attached: Code → Releases.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build.${{ github.run_number }}
          name: ERP ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          body: "Built from ${{ github.sha }} after analyze + test passed."
          files: erp-*.apk
